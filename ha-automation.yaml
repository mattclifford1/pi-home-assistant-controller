# Home Assistant automation: Sense HAT joystick -> bedroom lights + blinds.
#
# How to add it:
#   Settings -> Automations & Scenes -> Automations -> Create Automation
#   -> (three-dot menu, top right) -> "Edit in YAML" -> paste this -> Save.
#
# Replaces the older "Sense HAT joystick lights" automation — delete that one.
#
# The Pi publishes plain-text commands when the joystick is used:
#   sensehat/bedroom/lights/set  -> "toggle"
#   sensehat/bedroom/blinds/set  -> "open" | "close"
#
# TARGETING:
#   lights -> the "Bedroom" area (area_id: bedroom), i.e. every light in it.
#   blinds -> the "Bedroom Blinds" cover entity (cover.bedroom_blinds).
#
# Verify the blinds entity id: Developer Tools -> States, filter on "cover.".
# If it differs, change the two entity_id lines below to match. To target every
# cover in the Bedroom area instead, swap the entity_id for `area_id: bedroom`.

alias: Sense HAT bedroom controls
description: Joystick click toggles bedroom lights; up/down opens/closes blinds.
mode: queued
max: 10
triggers:
  - trigger: mqtt
    topic: sensehat/bedroom/lights/set
    id: lights
  - trigger: mqtt
    topic: sensehat/bedroom/blinds/set
    id: blinds
conditions: []
actions:
  - choose:
      # --- click -> toggle the bedroom lights ---
      - conditions:
          - condition: trigger
            id: lights
        sequence:
          - action: light.toggle
            target:
              area_id: bedroom

      # --- up -> open the blinds ---
      - conditions:
          - condition: trigger
            id: blinds
          - condition: template
            value_template: "{{ trigger.payload == 'open' }}"
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.bedroom_blinds

      # --- down -> close the blinds ---
      - conditions:
          - condition: trigger
            id: blinds
          - condition: template
            value_template: "{{ trigger.payload == 'close' }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.bedroom_blinds
